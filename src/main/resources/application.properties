spring.application.name=nomad
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nomad}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

nomad.seed-data=${NOMAD_SEED_DATA:true}

# Set to true to use a local dev fallback for payments (no Razorpay calls)
nomad.dev-payments=${NOMAD_DEV_PAYMENTS:false}

nomad.jwt.secret=${JWT_SECRET:change_this_secret_to_32_chars_min}
nomad.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}

spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:change_me}
spring.mail.password=${MAIL_PASSWORD:change_me}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
nomad.mail.from=${MAIL_FROM:no-reply@nomad.com}

nomad.sms.enabled=${NOMAD_SMS_ENABLED:false}
twilio.account-sid=${TWILIO_ACCOUNT_SID:change_me}
twilio.auth-token=${TWILIO_AUTH_TOKEN:change_me}
twilio.from-number=${TWILIO_FROM_NUMBER:+10000000000}

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:change_me_webhook_secret}

# --- Actuator and Logging ---
# env endpoint intentionally excluded - it leaks secrets/config over HTTP
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when_authorized
management.endpoint.metrics.enabled=true
management.endpoint.loggers.enabled=true
management.endpoint.env.enabled=false
management.endpoint.info.enabled=true
management.server.port=${MANAGEMENT_PORT:8081}

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.tripfactory.nomad=DEBUG
logging.file.name=logs/nomad-app.log
