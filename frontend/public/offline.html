<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>NOMAD - offline</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#000;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 40px}
  .wrap{max-width:560px;margin:0 auto}
  h1{margin:8px 0 2px;color:#9bb1ff;letter-spacing:.12em;font-size:22px}
  .sub{margin:0 0 18px;color:#94a3b8;font-size:14px}
  button,a.btn{display:inline-block;padding:10px 18px;border-radius:999px;border:0;background:#4f6cff;color:#fff;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
  a.go{padding:6px 14px;font-size:12px;background:#1e293b;border:1px solid #334155}
  .card{background:rgba(15,23,42,.8);border:1px solid #1e293b;border-radius:20px;padding:16px;margin:14px 0}
  .card h2{margin:0;font-size:18px}
  .meta{color:#94a3b8;font-size:13px;margin:2px 0 10px}
  .day{margin:12px 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#67e8f9;font-weight:700}
  .stop{display:flex;align-items:center;gap:10px;border:1px solid #1e293b;background:rgba(2,6,23,.5);border-radius:14px;padding:9px 12px;margin:6px 0}
  .t{width:92px;flex:none;color:#94a3b8;font-size:12px;font-weight:600}
  .n{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{color:#94a3b8;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>NOMAD</h1>
  <p class="sub">You're offline. Your saved trips are below.</p>
  <button onclick="location.reload()">Try again</button>
  <div id="trips"></div>
  <p class="note" id="note"></p>
</div>
<script>
(function () {
  var root = document.getElementById("trips"), note = document.getElementById("note");
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var data = null;
  try { data = JSON.parse(localStorage.getItem("nomad_offline_trips") || "null"); } catch (e) {}
  var trips = (data && data.trips) || [];
  var today = new Date(); today.setHours(0, 0, 0, 0);
  // Keep trips that haven't finished yet; if none, show the latest one.
  var live = trips.filter(function (t) {
    if (!t.date) return true;
    var last = 1; (t.plans || []).forEach(function (p) { if (p.d > last) last = p.d; });
    var end = new Date(t.date + "T00:00:00"); end.setDate(end.getDate() + last - 1);
    return end >= today;
  });
  if (!live.length && trips.length) live = [trips[trips.length - 1]];
  if (!live.length) { root.appendChild(el("p", "note", "No saved trips yet. Open NOMAD once with internet after booking and your itinerary will be kept here.")); return; }
  live.slice(0, 3).forEach(function (t) {
    var card = el("div", "card");
    card.appendChild(el("h2", "", (t.city ? t.city + " weekend" : "Weekend trip")));
    var when = "";
    if (t.date) { var d = new Date(t.date + "T00:00:00"); when = d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" }); }
    card.appendChild(el("p", "meta", (when ? when + " · " : "") + "Trip #" + t.id));
    var days = {};
    (t.plans || []).forEach(function (p) { (days[p.d] = days[p.d] || []).push(p); });
    Object.keys(days).sort(function (a, b) { return a - b; }).forEach(function (k) {
      card.appendChild(el("div", "day", "Day " + k));
      days[k].sort(function (a, b) { return (a.s || "").localeCompare(b.s || ""); }).forEach(function (p) {
        var row = el("div", "stop");
        row.appendChild(el("span", "t", (p.s || "") + (p.e ? "–" + p.e : "")));
        row.appendChild(el("span", "n", p.n));
        var a = el("a", "btn go", "Map");
        a.href = "geo:0,0?q=" + encodeURIComponent(p.n + " " + (t.city || ""));
        row.appendChild(a);
        card.appendChild(row);
      });
    });
    root.appendChild(card);
  });
  if (data && data.savedAt) note.textContent = "Saved " + new Date(data.savedAt).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + ". Times may have changed since; reconnect to refresh.";
})();
</script>
</body>
</html>
