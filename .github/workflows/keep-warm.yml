# Pings the backend every ~5 minutes so Render's free tier doesn't put it to sleep
# (it sleeps after 15 idle minutes, and waking takes up to a minute or more).
name: Keep backend warm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS -m 120 --retry 3 --retry-delay 10 https://nomads-backend-ea1a.onrender.com/actuator/health || echo "backend not healthy yet"
