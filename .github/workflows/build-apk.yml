name: Build Android APKs

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: https://nomads-frontend-sujays-projects-c5bb1f58.vercel.app

jobs:
  build:
    name: APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [mobile, laptop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          set -o pipefail
          bash android-app/build-apk.sh ${{ matrix.variant }} 2>&1 | tee build.log
      - name: Surface build errors as annotations
        if: failure()
        run: |
          MSG=$( { grep -E 'error:|FAILED|What went wrong|Caused by|cannot find symbol|symbol:|location:|Execution failed|No such file|syntax error|sed:' -A2 build.log | head -40; echo '--- tail ---'; tail -15 build.log; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=APK build failure::${MSG}"
      - uses: actions/upload-artifact@v4
        with:
          name: nomads-${{ matrix.variant }}
          path: apk-out/*.apk

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
      - name: Publish to the fixed "apk" release (link never changes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          VCODE=$((100 + ${{ github.run_number }}))
          NOTES="Latest build (#${{ github.run_number }}). versionCode: $VCODE. nomads-mobile.apk = phone layout. nomads-laptop.apk = desktop/laptop layout (landscape). These links never change: this release is updated in place."
          if gh release view apk --repo "$REPO" >/dev/null 2>&1; then
            gh release upload apk apks/*.apk --clobber --repo "$REPO"
            gh release edit apk --title "NOMAD app (latest)" --notes "$NOTES" --latest --repo "$REPO"
          else
            gh release create apk apks/*.apk --title "NOMAD app (latest)" --notes "$NOTES" --latest --repo "$REPO"
          fi
          echo "Phone:  https://github.com/$REPO/releases/download/apk/nomads-mobile.apk"
          echo "Laptop: https://github.com/$REPO/releases/download/apk/nomads-laptop.apk"
